<style>

*,*::before,*::after{box-sizing:border-box}

.card h3{font-size:25px}.card p{margin:4px 0 0;font-size:14.5px;color:var(--mute);line-height:1.5}.card-link{position:static;display:block;color:inherit;text-decoration:none}.card-link::after{content:"";position:absolute;inset:0;z-index:1}.variant-pick{position:relative;z-index:3}.card-photo{position:absolute;inset:0;display:grid;place-items:center;z-index:0;cursor:pointer}.card-photo .product-photo{width:100%;height:100%;object-fit:cover}.card-photo svg{width:72%}.variant-pick{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-size:13px;color:var(--mute)}.variant-pick select{max-width:100%;padding:8px 10px;border:1px solid var(--line);background:var(--ivory);font:inherit;color:var(--ink)}

.page-head{padding:clamp(40px,6vw,76px) 0 28px}.page-head h1{font-size:clamp(42px,6vw,80px)}.page-head p{color:var(--mute);margin:14px 0 0;max-width:52ch}
.crumbs{font-size:14px;color:var(--mute);margin-bottom:20px}.crumbs span{margin:0 8px}

details.acc{border-top:1px solid var(--line)}details.acc:last-of-type{border-bottom:1px solid var(--line)}

details.acc summary::-webkit-details-marker{display:none}details.acc summary::after{content:"+";color:var(--gold-deep)}details.acc[open] summary::after{content:"\2212"}
details.acc .body{padding:0 0 18px;color:var(--mute)}details.acc .body p{margin:0}
.err{color:var(--err);font-size:14px;margin:6px 0 0}
/* cart / forms */
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:clamp(28px,5vw,64px);align-items:start;padding-bottom:90px}
.line{display:grid;grid-template-columns:90px 1fr auto;gap:18px;padding:20px 0;border-top:1px solid var(--line)}
.line:last-of-type{border-bottom:1px solid var(--line)}

.line h3{font-size:24px}.line .sub{color:var(--mute);font-size:14.5px;margin:4px 0 10px}.rm{font-size:14px;color:var(--mute);margin-left:14px}
.summary{background:var(--pearl);border:1px solid var(--line);padding:26px;position:sticky;top:calc(var(--nav) + 20px)}
.summary h2{font-size:28px;margin-bottom:14px}.sr{display:flex;justify-content:space-between;gap:14px;padding:6px 0}
.sr.t{border-top:1px solid var(--line);margin-top:8px;padding-top:14px;font-size:19px}
.mini{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:6px 0;font-size:14.5px}.mini .thumb{width:48px}.mini small{display:block;color:var(--mute)}
.note{font-size:14px;color:var(--mute);margin:12px 0 18px}
.notice{border-left:2px solid var(--gold);background:var(--pearl);padding:14px 18px;margin:0 0 28px;font-size:15px}
fieldset{border:0;padding:0;margin:0 0 36px}legend{font-family:var(--serif);font-size:29px;padding:0;margin-bottom:6px}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}.f{display:flex;flex-direction:column;gap:6px}.f.full{grid-column:1/-1}
.f label{font-size:15px}.f label i{font-style:normal;color:var(--mute);font-size:13px}
.f input,.f select,.f textarea{font:inherit;font-size:16px;color:var(--ink);background:#F7F3EA;border:1px solid var(--line);padding:13px 15px;border-radius:0;width:100%}
.f textarea{min-height:96px;resize:vertical}.f [aria-invalid=true]{border-color:var(--err)}
.pay{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);background:#F7F3EA;padding:18px;cursor:pointer;margin-bottom:10px}
.pay input{margin-top:6px;accent-color:var(--emerald);width:18px;height:18px}.pay strong{display:block;font-family:var(--serif);font-weight:500;font-size:23px;line-height:1.2}.pay span{color:var(--mute);font-size:14.5px}
.pay:has(input:checked){border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:15px;margin-bottom:8px;cursor:pointer}.check input{margin-top:5px;accent-color:var(--emerald);width:18px;height:18px}
.empty{text-align:center;padding:clamp(60px,9vw,110px) 0}.empty h1{font-size:clamp(38px,5vw,60px)}.empty p{color:var(--mute);margin:12px auto 26px;max-width:40ch}
.done h1{font-size:clamp(38px,5.4vw,74px)}.orderid{display:inline-block;margin-top:22px;border:1px solid var(--gold);padding:8px 18px;letter-spacing:.14em}
.box{background:var(--pearl);border:1px solid var(--line);padding:24px;margin-top:28px}.box h2{font-size:27px;margin-bottom:12px}
.box dl{margin:0;display:grid;grid-template-columns:150px 1fr;gap:8px 18px}.box dt{color:var(--mute)}.box dd{margin:0}
.actions{display:flex;flex-wrap:wrap;gap:14px;margin:24px 0}
.prose h2{font-size:30px;margin:38px 0 10px}.prose a{color:var(--gold-deep)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:56px}.ccard{border:1px solid var(--line);background:#F7F3EA;padding:24px}.ccard h3{font-size:25px;margin-bottom:6px}.ccard p{margin:0 0 4px;color:var(--mute);overflow-wrap:anywhere}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,6vw,80px);padding-bottom:90px;align-items:start}

.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1.4fr;gap:40px;padding-bottom:44px}

/* ===== Sparkles by Siraa: pastel + white theme ===== */

/* loader: rounded bottom, counter + progress, content fades on exit */
#rl{border-radius:0 0 2rem 2rem}
#rl .tr{width:min(22rem,72vw);background:rgba(247,243,234,.18)}
#rl .cnt{display:flex;justify-content:space-between;width:min(22rem,72vw);margin-top:-1.25rem;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:rgba(247,243,234,.5)}
#rl .cnt b{font-weight:500;color:rgba(247,243,234,.85);font-variant-numeric:tabular-nums}
#rl.out .wm,#rl.out .tr,#rl.out .cnt{opacity:0;transform:translateY(-12px);transition:opacity .45s ease,transform .6s cubic-bezier(.22,1,.36,1)}


/* scroll layer: template-style springy reveals + hero scroll drift */
@media (prefers-reduced-motion:no-preference){
html.m-on .lv{opacity:0;translate:0 44px}
html.m-on .lv.story,html.m-on .lv.trust{scale:.985}
html.m-on .lv.lv-in{opacity:1;translate:0 0;scale:1;transition:opacity .8s ease var(--sd,0ms),translate 1.1s cubic-bezier(.22,1,.36,1) var(--sd,0ms),scale 1.1s cubic-bezier(.22,1,.36,1) var(--sd,0ms)}
.hero::after{translate:0 calc(var(--wp,0)*-60px)}
.hero .hcopy{will-change:translate,opacity}
}

html{scroll-behavior:auto!important}
.hero::after{will-change:translate}


/* collection page banner */
.shop-banner{position:relative;isolation:isolate;overflow:hidden;border-radius:2rem;margin:20px 0 28px;min-height:clamp(250px,32vw,400px);padding:clamp(28px,5vw,60px);display:flex;flex-direction:column;justify-content:flex-end;color:#F7F3EA;background:linear-gradient(0deg,rgba(52,55,45,.78) 0%,rgba(52,55,45,.38) 48%,rgba(52,55,45,.12) 100%),url(images/banner_sparkles.jpg) center/cover no-repeat}
.shop-banner .crumbs,.shop-banner .crumbs a{color:rgba(247,243,234,.85)}
.shop-banner h1{color:#F7F3EA;text-shadow:0 2px 18px rgba(52,55,45,.35)}
.shop-banner p{color:rgba(247,243,234,.92);max-width:46ch}
@media(max-width:520px){.shop-banner{border-radius:1.25rem;min-height:230px}}

/* cursor liquid reveal canvas (lives inside the hero photo layer) */
.lq{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}

.ph img.product-photo{display:block;width:100%;height:100%;object-fit:contain;background:#fff}

/* ===== Sage theme: Sage Green #777B65 / Deep Sage #555B46 / Ivory #F7F3EA / Warm Beige #E8DFD0 / Text #34372D ===== */
::selection{background:#777B65;color:#F7F3EA}
.trust{background:#555B46}.trust strong{color:#F7F3EA}.trust span{color:#E8DFD0}
.eyebrow{color:#555B46}
.hero h1 em{color:#777B65}
.badge{background:#555B46;color:#F7F3EA}
.btn.gold{background:#E8DFD0;border-color:#777B65;color:#34372D}
.btn.gold:hover{background:transparent;border-color:#555B46;color:#555B46}
footer{background:#E8DFD0}
.variant-pick{display:block;border:0;padding:0;margin:12px 0 0;min-width:0;font-size:13px;color:var(--mute)}
.variant-pick legend{padding:0;margin:0 0 8px;font-size:13px;color:var(--mute)}
.vswatches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pdp .vswatches{grid-template-columns:repeat(3,minmax(0,130px));gap:12px}
.vsw{position:relative;display:block;cursor:pointer}
.vsw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.vsw-box{display:flex;flex-direction:column;height:100%;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#F7F3EA;transition:border-color .2s,box-shadow .2s}
.vsw-box img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--pearl)}
.vsw-name{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 5px 8px;font-size:12.5px;font-weight:500;line-height:1.25;text-align:center;color:var(--ink)}
.vsw:hover .vsw-box{border-color:var(--gold)}
.vsw input:checked+.vsw-box{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.vsw input:focus-visible+.vsw-box{outline:2px solid var(--gold);outline-offset:2px}
@media(max-width:560px){.vswatches{gap:6px}.vsw-name{font-size:11px;padding:5px 3px 6px}}
/* phones / touch: small corner button so it no longer covers the product */
@media(hover:none),(max-width:520px){
.qbar{left:auto;right:10px;bottom:10px;padding:5px;border-radius:50%;gap:0}
.qbtn{width:38px;height:38px;padding:0;font-size:0;letter-spacing:0;line-height:0;display:grid;place-items:center}
.qbtn::before{content:"+";font-size:24px;line-height:1;letter-spacing:0}
}
.ph img.product-photo{object-position:center}
.card .ph img.product-photo,.card-photo .product-photo{object-fit:cover;object-position:center}
/* category + occasion cards: photo on top, name underneath */
.cats{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cats .cat,.cats .cat:nth-child(n){position:static;display:flex;flex-direction:column;aspect-ratio:auto;padding:0;overflow:hidden;background:#F7F3EA;border:1px solid var(--line);border-radius:14px}
.cats .cat img{position:static;display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;object-position:center}
.cats .cat h3{position:static;margin:0;padding:10px 8px 12px;font-size:22px;line-height:1.2;text-align:center;color:var(--ink);text-shadow:none;background:none}
.cats .cat:hover{border-color:var(--ink)}
@media(max-width:560px){.cats{gap:8px}.cats .cat{border-radius:10px}.cats .cat h3{font-size:15px;padding:8px 4px 10px}}
/* category line, then occasion line under one heading */
.cats-next{margin-top:12px}
@media(max-width:560px){.cats-next{margin-top:8px}}

/* ---------- Google Sheet sending (unchanged logic) ---------- */
function sheetOn(){return /^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/exec$/.test(CONFIG.sheetEndpoint)}
function postSheet(payload){
  payload.key=CONFIG.sheetKey;
  var ctl=("AbortController" in window)?new AbortController():null,timer;
  var req=fetch(CONFIG.sheetEndpoint,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload),keepalive:true,signal:ctl?ctl.signal:undefined}).then(function(){return true});
  var to=new Promise(function(res,rej){timer=setTimeout(function(){if(ctl)ctl.abort();rej(new Error("timeout"))},15000)});
  return Promise.race([req,to]).then(function(r){clearTimeout(timer);return r},function(e){clearTimeout(timer);throw e});
}
function sendOrQueue(payload){
  if(!sheetOn())return Promise.resolve(false);
  return postSheet(payload).then(function(){return true}).catch(function(){var q=store(true,"sparkles_queue")||[];q.push(payload);store(false,"sparkles_queue",q);return false});
}
function flushQueue(){if(!sheetOn())return;var q=store(true,"sparkles_queue")||[];if(!q.length)return;store(false,"sparkles_queue",[]);q.forEach(function(p){sendOrQueue(p)})}
window.addEventListener("online",flushQueue);
/* ---------- Ziina online payments via the same Apps Script (unchanged logic) ---------- */
function zinaOn(){return sheetOn()&&!!CONFIG.payments.online}
function postSheetJSON(payload,ms){
  payload.key=CONFIG.sheetKey;
  var ctl=("AbortController" in window)?new AbortController():null,timer;
  var req=fetch(CONFIG.sheetEndpoint,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload),signal:ctl?ctl.signal:undefined}).then(function(r){return r.json()});
  var to=new Promise(function(res,rej){timer=setTimeout(function(){if(ctl)ctl.abort();rej(new Error("timeout"))},ms||20000)});
  return Promise.race([req,to]).then(function(r){clearTimeout(timer);return r},function(e){clearTimeout(timer);throw e});
}

 root.querySelectorAll(".btn").forEach(b=>{if(b.dataset.ar)return;b.dataset.ar=1;const t=b.lastChild;
  if(t&&t.nodeType===3&&/(→|\u2192)\s*$/.test(t.textContent)){const s=D.createElement("span");s.className="arw";s.textContent="→";t.textContent=t.textContent.replace(/\s*(→)\s*$/,"")+" ";b.append(s)}});
 root.querySelectorAll(".hero-media").forEach(m=>{if(m.dataset.ld)return;m.dataset.ld=1;const u=(getComputedStyle(m).backgroundImage.match(/url\(["']?(.*?)["']?\)/)||[])[1];

 const sc=root.querySelector&&root.querySelector("#scrollCue");
 if(sc&&!sc.dataset.b){sc.dataset.b=1;sc.addEventListener("click",()=>{const h=D.querySelector(".hero"),y=h.offsetTop+h.offsetHeight;lenis?lenis.scrollTo(y):scrollTo({top:y,behavior:"smooth"})})}}
let px=[];const pick=()=>{px=[...D.querySelectorAll(".hero-media,.story-media")]};
function tick(){px.forEach(el=>{const sec=el.parentElement,r=sec.getBoundingClientRect(),vh=innerHeight;
 if(r.bottom<0||r.top>vh)return;const p=Math.min(1,Math.max(0,(vh-r.top)/(vh+r.height)));

if(!reduce)(function loop(){tick();requestAnimationFrame(loop)})();

<script>
/* Lumora template: loader counter + liquid cursor reveal (plain JS, no libraries) */
(function(){
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce)return;

  /* loader counter 000 -> 100, easeInOutCubic over 1300ms */
  var cEl=document.getElementById("rlc");
  if(cEl){var t0=0,FILL=1300;requestAnimationFrame(function f(ts){if(!t0)t0=ts;var t=Math.min((ts-t0)/FILL,1),e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;cEl.textContent=String(Math.round(e*100)).padStart(3,"0");if(t<1)requestAnimationFrame(f)})}


  /* ---- scroll layer ---- */
  var H=document.documentElement;
  // 2) springy reveals for sections that had none
  var SR=".story,.trust,.pdp>*,.ccard,.box,.cols2>*,.grid2>form,.prose h2,.film,.fgrid>*";
  var sio=new IntersectionObserver(function(es){es.forEach(function(e){
    if(!e.isIntersecting)return;sio.unobserve(e.target);var el=e.target;
    var go=function(){el.classList.add("lv-in");setTimeout(function(){el.classList.remove("lv","lv-in");el.style.removeProperty("--sd")},2600)};
    if(H.classList.contains("m-ready"))go();else{var t=setInterval(function(){if(H.classList.contains("m-ready")){clearInterval(t);go()}},100)}
  })},{threshold:.1,rootMargin:"0px 0px -6% 0px"});
  function srScan(){
    var seen=new Map();
    document.querySelectorAll(SR).forEach(function(el){
      if(el.dataset.lv||el.classList.contains("m-r"))return;el.dataset.lv=1;
      var p=el.parentElement,i=seen.get(p)||0;seen.set(p,i+1);
      el.style.setProperty("--sd",Math.min(i,4)*90+"ms");
      el.classList.add("lv");sio.observe(el);
    });
  }
  var mainEl=document.getElementById("main"),ftEl=document.getElementById("footer");
  if(mainEl)new MutationObserver(srScan).observe(mainEl,{childList:true});
  if(ftEl)new MutationObserver(srScan).observe(ftEl,{childList:true});
  srScan();
  // 3) hero drifts up and fades as you scroll away
  (function loop(){
    var h=document.querySelector(".hero");
    if(h){var r=h.getBoundingClientRect(),p=Math.min(1,Math.max(0,-r.top/Math.max(1,r.height))).toFixed(3);
      if(h.__p!==p){h.__p=p;h.style.setProperty("--wp",p);
      var c=h.querySelector(".hcopy");if(c){c.style.translate="0 "+(p*70).toFixed(1)+"px";c.style.opacity=Math.max(0,1-p*1.1).toFixed(3)}}}
    requestAnimationFrame(loop);
  })();

  /* liquid reveal: moving the pointer paints a soft brush trail that clears the cream veil on the hero photo */
  var BRUSH=143,DECAY=.016,MAXIDLE=120,insts=[];
  function mount(media){
    if(media.dataset.lq)return;
    var m=(getComputedStyle(media).backgroundImage||"").match(/url\(["']?(.*?)["']?\)/);
    if(!m)return;
    media.dataset.lq=1;
    var cv=document.createElement("canvas");cv.className="lq";cv.setAttribute("aria-hidden","true");media.appendChild(cv);
    var ctx=cv.getContext("2d"),cover=document.createElement("canvas"),cctx=cover.getContext("2d"),brush=document.createElement("canvas"),bctx=brush.getContext("2d");
    var img=new Image(),loaded=false,dpr=Math.min(window.devicePixelRatio||1,2),radius=BRUSH*dpr,W=1,H=1,pts=[],last=null,idle=MAXIDLE+1,raf=0,dead=false;
    function paintCover(){
      if(!loaded)return;
      cctx.clearRect(0,0,W,H);
      var s=Math.max(W/img.naturalWidth,H/img.naturalHeight),dw=img.naturalWidth*s,dh=img.naturalHeight*s;
      try{cctx.filter="saturate(1.2) contrast(1.06)"}catch(e){}
      cctx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
      try{cctx.filter="none"}catch(e){}
    }
    function size(){
      W=Math.max(1,Math.round(media.offsetWidth*dpr));H=Math.max(1,Math.round(media.offsetHeight*dpr));
      cv.width=cover.width=W;cv.height=cover.height=H;
      brush.width=brush.height=Math.ceil(radius*2);
      paintCover();
    }
    function stamp(p){
      var d=brush.width,c=d/2;
      bctx.globalCompositeOperation="source-over";bctx.clearRect(0,0,d,d);
      var g=bctx.createRadialGradient(c,c,0,c,c,c);
      g.addColorStop(0,"rgba(255,255,255,1)");g.addColorStop(.55,"rgba(255,255,255,.82)");g.addColorStop(1,"rgba(255,255,255,0)");
      bctx.fillStyle=g;bctx.fillRect(0,0,d,d);
      bctx.globalCompositeOperation="source-in";
      bctx.drawImage(cover,p.x-c,p.y-c,d,d,0,0,d,d);
      ctx.globalCompositeOperation="source-over";
      ctx.drawImage(brush,p.x-c,p.y-c);
    }
    function tick(){
      raf=0;if(dead)return;
      var drawing=pts.length>0;
      if(drawing)idle=0;else{idle++;if(idle>MAXIDLE)return}
      var fade=drawing?DECAY:Math.min(DECAY+idle*.004,.5);
      ctx.globalCompositeOperation="destination-out";ctx.fillStyle="rgba(0,0,0,"+fade+")";ctx.fillRect(0,0,W,H);
      if(drawing){for(var i=0;i<pts.length;i++)stamp(pts[i]);pts.length=0}
      else if(idle===MAXIDLE){ctx.clearRect(0,0,W,H)}
      raf=requestAnimationFrame(tick);
    }
    function onMove(e){
      if(!loaded)return;
      var r=cv.getBoundingClientRect();if(!r.width||!r.height)return;
      var x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
      if(x<-radius||y<-radius||x>W+radius||y>H+radius){last=null;return}
      if(last){
        var dx=x-last.x,dy=y-last.y,dist=Math.hypot(dx,dy),step=Math.max(radius*.3,1),n=Math.min(Math.ceil(dist/step),60);
        for(var i=1;i<=n;i++)pts.push({x:last.x+dx*i/n,y:last.y+dy*i/n});
      }else pts.push({x:x,y:y});
      last={x:x,y:y};
      if(!raf)raf=requestAnimationFrame(tick);
    }
    img.onload=function(){loaded=true;size()};
    img.src=m[1];
    var ro=window.ResizeObserver?new ResizeObserver(size):null;if(ro)ro.observe(media);
    addEventListener("pointermove",onMove,{passive:true});
    insts.push({media:media,destroy:function(){dead=true;if(raf)cancelAnimationFrame(raf);removeEventListener("pointermove",onMove);if(ro)ro.disconnect()}});
  }
  function scan(){
    insts=insts.filter(function(i){if(i.media.isConnected)return true;i.destroy();return false});
    document.querySelectorAll(".hero > .hero-media").forEach(mount);
  }
  var main=document.getElementById("main");
  if(main)new MutationObserver(scan).observe(main,{childList:true});
  scan();
})();
</script>

<script>
/* Built-in smooth wheel scrolling (no library). Stays idle whenever Lenis is running. */
(function(){
  var H=document.documentElement,tgt=0,cur=0,raf=0,ours=null,last=0,on=false;
  var EASE=0.1;
  function max(){return Math.max(0,H.scrollHeight-innerHeight)}
  function lenisOn(){return H.classList.contains("lenis")}
  function scrollable(el){
    while(el&&el!==document.body&&el!==H){
      var cs=getComputedStyle(el),oy=cs.overflowY;
      if((oy==="auto"||oy==="scroll")&&el.scrollHeight>el.clientHeight+1)return true;
      el=el.parentElement;
    }
    return false;
  }
  function frame(ts){
    raf=0;
    if(lenisOn()){on=false;return}
    var dt=Math.min(64,ts-(last||ts));last=ts;
    var k=1-Math.pow(1-EASE,dt/16.667);
    cur+=(tgt-cur)*k;
    if(Math.abs(tgt-cur)<.4)cur=tgt;
    ours=Math.round(cur);scrollTo(0,cur);
    if(cur!==tgt)raf=requestAnimationFrame(frame);else last=0;
  }
  function onWheel(e){
    if(e.defaultPrevented||e.ctrlKey||lenisOn())return;
    if(Math.abs(e.deltaX)>Math.abs(e.deltaY))return;
    var t=e.target;
    if(t.closest&&t.closest("textarea,select,[role=dialog]"))return;
    if(scrollable(t))return;
    if(!on){cur=tgt=scrollY;on=true}
    var d=e.deltaMode===1?e.deltaY*34:e.deltaMode===2?e.deltaY*innerHeight:e.deltaY;
    tgt=Math.min(max(),Math.max(0,tgt+d));
    e.preventDefault();
    if(!raf)raf=requestAnimationFrame(frame);
  }
  /* keep in sync when something else moves the page (keyboard, scrollbar drag, links, router) */
  addEventListener("scroll",function(){
    if(ours!==null&&Math.abs(scrollY-ours)<=2)return;
    if(!raf){cur=tgt=scrollY}
  },{passive:true});
  addEventListener("hashchange",function(){setTimeout(function(){cur=tgt=scrollY},60)});
  addEventListener("resize",function(){tgt=Math.min(tgt,max())});
  addEventListener("wheel",onWheel,{passive:false});
})();
</script>
<script>
/* card photos: match each card's frame to its photo so nothing is cropped off */
(function(){
  function fit(img){
    if(!img.naturalWidth||!img.naturalHeight)return;
    var ph=img.closest('.card .ph'); if(!ph)return;
    var r=img.naturalWidth/img.naturalHeight;
    r=Math.min(1.2,Math.max(0.7,r));
    ph.style.aspectRatio=r.toFixed(4);
  }
  function sweep(){document.querySelectorAll('.card .ph img.product-photo').forEach(function(i){if(i.complete)fit(i)})}
  document.addEventListener('load',function(e){if(e.target&&e.target.tagName==='IMG'&&e.target.classList.contains('product-photo'))fit(e.target)},true);
  new MutationObserver(sweep).observe(document.documentElement,{childList:true,subtree:true});
  sweep();
})();
</script>
<script>
/* Launch offer popup: opens 8 seconds after the site loads (once per visit) */
(function(){
  if(typeof offerActive!=="function"||!offerActive())return;
  var o=CONFIG.offer;
  try{if(sessionStorage.getItem("offerSeen"))return}catch(e){}
  var pop=document.createElement("div");
  pop.className="offer-pop";pop.setAttribute("role","dialog");pop.setAttribute("aria-modal","true");pop.setAttribute("aria-labelledby","offerTitle");
  pop.innerHTML='<div class="offer-card"><button type="button" class="offer-x" aria-label="Close offer">&times;</button>'+
    '<span class="kick">'+o.name+'</span>'+
    '<h2 class="big" id="offerTitle">'+o.percent+'%<small>off</small></h2>'+
    '<p>Shop for <b>'+CONFIG.currency+' '+o.minSpend+'</b> or more and get <b>'+o.percent+'% off</b>. It is applied automatically in your cart.</p>'+
    '<p class="until">Limited time only, until '+offerEndText()+'.</p>'+
    '<a class="btn" href="#/shop">Start shopping</a></div>';
  var last=null;
  function close(){
    pop.classList.remove("on");
    document.removeEventListener("keydown",key);
    try{sessionStorage.setItem("offerSeen","1")}catch(e){}
    setTimeout(function(){pop.remove();if(last&&last.focus)last.focus()},350);
  }
  function key(e){if(e.key==="Escape")close()}
  setTimeout(function(){
    last=document.activeElement;
    document.body.appendChild(pop);
    requestAnimationFrame(function(){pop.classList.add("on");var b=pop.querySelector(".btn");if(b)b.focus()});
    document.addEventListener("keydown",key);
  },8000);
  pop.addEventListener("click",function(e){if(e.target===pop||e.target.closest(".offer-x")||e.target.closest(".btn"))close()});
})();
</script>
